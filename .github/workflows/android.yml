
name: Build ITI Study Hub APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Install Capacitor CLI
        run: npm install --save-dev @capacitor/cli

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html style.css App.js manifest.json service-worker.js www/

      - name: Create Android project
        run: ./node_modules/.bin/cap add android

      - name: Sync Capacitor
        run: ./node_modules/.bin/cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ITI-Study-Hub-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
